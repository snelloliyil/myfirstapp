<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Query - Duck Creek</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f3f4f6;
            color: #333;
            padding: 2rem;
            min-height: 100vh;
        }

        header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        header h1 { font-size: 1.5rem; color: #0078d4; }
        header span { font-size: 0.9rem; color: #666; margin-left: auto; }

        /* Search bar */
        .search-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 1.25rem 1.5rem;
            margin-bottom: 1.5rem;
        }

        .search-card label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 0.5rem;
        }

        .search-row {
            display: flex;
            gap: 0.75rem;
        }

        .search-row input {
            flex: 1;
            padding: 0.6rem 0.9rem;
            border: 1.5px solid #d0d7de;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .search-row input:focus { border-color: #0078d4; }

        .search-row button {
            padding: 0.6rem 1.25rem;
            background: #0078d4;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .search-row button:hover { background: #005fa3; }
        .search-row button:disabled { background: #94b8d4; cursor: not-allowed; }

        .hint { font-size: 0.78rem; color: #888; margin-top: 0.4rem; }

        /* Results list */
        #results-section { display: none; margin-bottom: 1.5rem; }

        .results-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .results-header {
            background: #f0f6ff;
            padding: 0.7rem 1.25rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: #0078d4;
            border-bottom: 1px solid #d0e4f7;
        }

        .result-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.75rem 1.25rem;
            border-bottom: 1px solid #e9ecef;
            cursor: pointer;
            transition: background 0.12s;
        }

        .result-item:last-child { border-bottom: none; }
        .result-item:hover { background: #f0f6ff; }
        .result-item.active { background: #e6f2ff; border-left: 3px solid #0078d4; }

        .result-id {
            font-family: monospace;
            font-size: 0.82rem;
            color: #0078d4;
            font-weight: 700;
            min-width: 52px;
        }

        .result-title {
            flex: 1;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .result-meta { font-size: 0.78rem; color: #888; white-space: nowrap; }

        /* Ticket detail */
        #detail-section { display: none; }

        .detail-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .detail-header {
            background: #0078d4;
            color: #fff;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .detail-header-text { flex: 1; }

        .detail-id {
            font-size: 0.82rem;
            opacity: 0.85;
            font-family: monospace;
            margin-bottom: 0.25rem;
        }

        .detail-title {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.3;
        }

        .detail-header a {
            color: #fff;
            opacity: 0.8;
            font-size: 0.78rem;
            text-decoration: none;
            white-space: nowrap;
            padding: 4px 10px;
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 4px;
            margin-top: 2px;
            display: inline-block;
        }

        .detail-header a:hover { opacity: 1; background: rgba(255,255,255,0.15); }

        .detail-body { padding: 1.5rem; }

        /* Badges row */
        .badges { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem; }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .badge-type { background: #e6f2ff; color: #0078d4; border: 1px solid #b3d4f5; }
        .badge-state-new { background: #fff3e0; color: #e65100; border: 1px solid #ffcc80; }
        .badge-state-active { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .badge-state-closed { background: #eeeeee; color: #616161; border: 1px solid #bdbdbd; }
        .badge-state-resolved { background: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; }
        .badge-state-default { background: #f3e5f5; color: #6a1b9a; border: 1px solid #ce93d8; }
        .badge-sev { background: #fde8e8; color: #b71c1c; border: 1px solid #ef9a9a; }
        .badge-pri { background: #fff8e1; color: #f57f17; border: 1px solid #ffe082; }
        .badge-customer { background: #fce4ec; color: #880e4f; border: 1px solid #f48fb1; }

        /* Info grid */
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .info-item { display: flex; flex-direction: column; gap: 2px; }

        .info-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .info-value { font-size: 0.9rem; color: #222; }

        .info-value.email { font-size: 0.8rem; color: #666; }

        /* Assignee card */
        .assignee-block {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.9rem 1rem;
            background: #f8faff;
            border: 1px solid #d0e4f7;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #0078d4;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .assignee-name { font-weight: 600; font-size: 0.95rem; }
        .assignee-email { font-size: 0.8rem; color: #666; }

        /* Description */
        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.6rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid #e9ecef;
        }

        .description-box {
            background: #fafafa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 1rem;
            font-size: 0.88rem;
            line-height: 1.6;
            max-height: 300px;
            overflow-y: auto;
            color: #333;
        }

        .description-box p { margin-bottom: 0.5rem; }
        .description-box ul, .description-box ol { margin-left: 1.2rem; margin-bottom: 0.5rem; }

        .no-description { color: #aaa; font-style: italic; font-size: 0.88rem; }

        /* States */
        .loading-msg, .error-msg, .empty-msg {
            padding: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .error-msg { color: #c62828; background: #ffebee; border-radius: 6px; }
        .empty-msg { color: #888; }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <svg width="36" height="36" viewBox="0 0 32 32" fill="none">
        <rect width="32" height="32" rx="6" fill="#0078d4"/>
        <path d="M7 22L13 10l5 8 3-4 5 8H7z" fill="white" opacity="0.9"/>
    </svg>
    <h1>Ticket Query &mdash; Duck Creek</h1>
    <span>org: dcteng</span>
</header>

<!-- Search -->
<div class="search-card">
    <label for="search-input">Search by ticket number or keyword</label>
    <div class="search-row">
        <input type="text" id="search-input" placeholder="e.g. 19799 or &quot;blob storage&quot;" autocomplete="off"/>
        <button id="search-btn" onclick="handleSearch()">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                <circle cx="6.5" cy="6.5" r="5" stroke="white" stroke-width="1.8"/>
                <line x1="10.5" y1="10.5" x2="14.5" y2="14.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            Search
        </button>
    </div>
    <p class="hint">Enter a numeric ID to jump straight to the ticket, or type a keyword to search titles.</p>
</div>

<!-- Results list -->
<div id="results-section">
    <div class="results-card">
        <div class="results-header" id="results-header">Results</div>
        <div id="results-list"></div>
    </div>
</div>

<!-- Ticket detail -->
<div id="detail-section">
    <div class="detail-card" id="detail-card"></div>
</div>

<script>
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');

    searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleSearch(); });

    // Auto-load ticket if ?id= param present (linked from ticket-list.html)
    const urlId = new URLSearchParams(window.location.search).get('id');
    if (urlId) {
        searchInput.value = urlId;
        loadTicket(parseInt(urlId));
    }

    async function handleSearch() {
        const val = searchInput.value.trim();
        if (!val) return;

        const isId = /^\d+$/.test(val);
        setSearchLoading(true);

        if (isId) {
            hideResults();
            await loadTicket(parseInt(val));
        } else {
            await searchTickets(val);
        }

        setSearchLoading(false);
    }

    function setSearchLoading(on) {
        searchBtn.disabled = on;
        searchBtn.innerHTML = on
            ? '<span class="spinner"></span> Searching...'
            : '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="6.5" cy="6.5" r="5" stroke="white" stroke-width="1.8"/><line x1="10.5" y1="10.5" x2="14.5" y2="14.5" stroke="white" stroke-width="1.8" stroke-linecap="round"/></svg> Search';
    }

    async function searchTickets(q) {
        try {
            const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
            const data = await res.json();

            if (!res.ok) return showResultsError(data.error);

            const items = data.items || [];
            showResultsSection();
            document.getElementById('results-header').textContent = `${items.length} result${items.length !== 1 ? 's' : ''} for "${q}"`;

            const list = document.getElementById('results-list');
            if (items.length === 0) {
                list.innerHTML = '<div class="empty-msg">No tickets found.</div>';
                return;
            }

            list.innerHTML = items.map(item =>
                `<div class="result-item" onclick="selectResult(${item.id}, this)">
                    <span class="result-id">#${item.id}</span>
                    <span class="result-title">Loading...</span>
                    <span class="result-meta"></span>
                </div>`
            ).join('');

            // Load titles for each result
            items.forEach(async (item, i) => {
                const row = list.children[i];
                try {
                    const r = await fetch(`/api/ticket/${item.id}`);
                    const t = await r.json();
                    if (r.ok) {
                        row.querySelector('.result-title').textContent = t.title;
                        row.querySelector('.result-meta').textContent = `${t.type} · ${t.state}`;
                    }
                } catch (_) {}
            });

        } catch (err) {
            showResultsError(err.message);
        }
    }

    async function selectResult(id, el) {
        document.querySelectorAll('.result-item').forEach(r => r.classList.remove('active'));
        el.classList.add('active');
        await loadTicket(id);
    }

    async function loadTicket(id) {
        showDetailLoading();
        try {
            const res = await fetch(`/api/ticket/${id}`);
            const data = await res.json();
            if (!res.ok) return showDetailError(data.error);
            renderTicket(data);
        } catch (err) {
            showDetailError(err.message);
        }
    }

    function renderTicket(t) {
        const stateClass = {
            'New': 'badge-state-new',
            'Active': 'badge-state-active',
            'Closed': 'badge-state-closed',
            'Resolved': 'badge-state-resolved',
        }[t.state] || 'badge-state-default';

        const initials = t.assignedTo
            ? t.assignedTo.name.split(/[\s,]+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase()
            : '?';

        const descHtml = t.description
            ? `<div class="description-box">${t.description}</div>`
            : `<p class="no-description">No description provided.</p>`;

        const html = `
            <div class="detail-header">
                <div class="detail-header-text">
                    <div class="detail-id">#${t.id} &mdash; ${t.type}</div>
                    <div class="detail-title">${escHtml(t.title)}</div>
                </div>
                <a href="${t.url}" target="_blank">Open in ADO ↗</a>
            </div>
            <div class="detail-body">

                <div class="badges">
                    <span class="badge badge-type">${escHtml(t.type)}</span>
                    <span class="badge ${stateClass}">${escHtml(t.state)}</span>
                    ${t.severity ? `<span class="badge badge-sev">⚡ ${escHtml(t.severity)}</span>` : ''}
                    ${t.priority ? `<span class="badge badge-pri">P${t.priority}</span>` : ''}
                    ${t.customerHighPriority ? `<span class="badge badge-customer">★ Customer Priority</span>` : ''}
                </div>

                <div class="section-title">Assignee</div>
                <div class="assignee-block">
                    <div class="avatar">${initials}</div>
                    <div>
                        <div class="assignee-name">${t.assignedTo ? escHtml(t.assignedTo.name) : 'Unassigned'}</div>
                        ${t.assignedTo ? `<div class="assignee-email">${escHtml(t.assignedTo.email)}</div>` : ''}
                    </div>
                </div>

                <div class="section-title" style="margin-top:1.5rem">Details</div>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">State</span>
                        <span class="info-value">${escHtml(t.state)}${t.reason ? ` — ${escHtml(t.reason)}` : ''}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Area Path</span>
                        <span class="info-value">${escHtml(t.areaPath || '—')}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Iteration</span>
                        <span class="info-value">${escHtml(t.iterationPath || '—')}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Created By</span>
                        <span class="info-value">${escHtml(t.createdBy || '—')}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Created Date</span>
                        <span class="info-value">${formatDate(t.createdDate)}</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Last Modified</span>
                        <span class="info-value">${formatDate(t.changedDate)}</span>
                    </div>
                    ${t.tags ? `<div class="info-item">
                        <span class="info-label">Tags</span>
                        <span class="info-value">${escHtml(t.tags)}</span>
                    </div>` : ''}
                    <div class="info-item">
                        <span class="info-label">Comments</span>
                        <span class="info-value">${t.commentCount ?? 0}</span>
                    </div>
                </div>

                <div class="section-title">Summary / Description</div>
                ${descHtml}
            </div>
        `;

        const section = document.getElementById('detail-section');
        const card = document.getElementById('detail-card');
        card.innerHTML = html;
        section.style.display = 'block';
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function showDetailLoading() {
        const section = document.getElementById('detail-section');
        const card = document.getElementById('detail-card');
        card.innerHTML = '<div class="loading-msg">Loading ticket...</div>';
        section.style.display = 'block';
    }

    function showDetailError(msg) {
        const card = document.getElementById('detail-card');
        card.innerHTML = `<div class="error-msg">Error: ${escHtml(msg)}</div>`;
    }

    function showResultsSection() {
        document.getElementById('results-section').style.display = 'block';
    }

    function hideResults() {
        document.getElementById('results-section').style.display = 'none';
    }

    function showResultsError(msg) {
        showResultsSection();
        document.getElementById('results-list').innerHTML = `<div class="error-msg" style="margin:1rem">Error: ${escHtml(msg)}</div>`;
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatDate(iso) {
        if (!iso) return '—';
        return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    }
</script>

</body>
</html>
